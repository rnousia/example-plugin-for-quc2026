<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Roller Frame / Metal Rod -->
  <path
    d="M 19.5,9.5 L 19.5,6.5 C 19.5,5.5 18.5,4.5 17.5,4.5 L 12,4.5 M 19.5,9.5 L 14,9.5 C 13,9.5 12,10.5 12,11.5 L 12,14"
    fill="none"
    stroke="#000000"
    stroke-width="0.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Unpainted Roller Base -->
  <rect
    x="3"
    y="3"
    width="15"
    height="6"
    rx="1.5"
    fill="#F3F4F6"
    stroke="#000000"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Roller Surface Texture Lines -->
  <line x1="14" y1="4.5" x2="16" y2="7.5" stroke="#D1D5DB" stroke-width="0.6" stroke-linecap="round" />
  <line x1="16" y1="4.5" x2="17" y2="6" stroke="#D1D5DB" stroke-width="0.6" stroke-linecap="round" />

  <!-- Partial Wet Paint (#002F6C) with Drips -->
  <path
    d="M 3,3 L 11.5,3 L 11.5,9 C 10.2,9 10,10.5 9.2,10.5 C 8.5,10.5 8.2,9 7.2,9 C 6.5,9 6.2,10 5.5,10 C 4.8,10 4.6,9 3.8,9 C 3.3,9 3,9 3,9 Z"
    fill="#002F6C"
    stroke="#000000"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Paint Gloss Highlight -->
  <path d="M 4,4.2 L 10,4.2" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" opacity="0.6" />

  <!-- Orange Ergonomic Handle -->
  <path
    d="M 10.5,14 L 13.5,14 C 13.8,14.8 13.5,15.5 13.5,17 C 13.5,18.5 13.8,19.2 13.5,21 C 13.5,21.5 12.8,22 12,22 C 11.2,22 10.5,21.5 10.5,21 C 10.5,19.2 10.8,18.5 10.8,17 C 10.8,15.5 10.5,14.8 10.5,14 Z"
    fill="#FF6B00"
    stroke="#000000"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Handle Highlight -->
  <path d="M 11.3,15 L 11.3,20.5" stroke="#FF9E43" stroke-width="0.6" stroke-linecap="round" />
</svg>
